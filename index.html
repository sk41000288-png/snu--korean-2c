<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>수업 자료</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #f8fafc;
    color: #475569;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "맑은 고딕", sans-serif;
    text-align: center;
    line-height: 1.6;
  }
  .box { max-width: 420px; }
  h1 { font-size: 17px; font-weight: 700; color: #334155; margin: 0 0 8px; }
  p { margin: 0; font-size: 14px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="box">
    <h1>수업 자료</h1>
    <p>이 주소는 특정 수업용 자료입니다.<br>안내받은 링크로 접속해 주세요.</p>
  </div>
</body>
</html>
