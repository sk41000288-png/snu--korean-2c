<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1A 한글 발음편 · 390px 미리보기</title>
<style>
  html,body{margin:0;padding:0;background:#242832;font-family:-apple-system,"Malgun Gothic",sans-serif}
  body{display:flex;align-items:flex-start;justify-content:center;padding:18px;min-height:100vh;box-sizing:border-box}
  .phone{width:410px;height:880px;border:10px solid #0d0f14;border-radius:38px;background:#000;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden;flex:none}
  .phone iframe{width:390px;height:860px;border:0;display:block;background:#f6f2ea}
  .note{color:#c9d1e0;font-size:13px;margin-left:20px;max-width:320px;line-height:1.6}
</style>
</head>
<body>
  <div class="phone"><iframe id="app" title="1A 한글 발음편 390px 미리보기"></iframe></div>
  <p class="note">390px 모바일 폭 미리보기<br>(?to=요소id 로 스크롤, #해시로 탭 열기)</p>
<script>
  var f = document.getElementById('app');
  f.setAttribute('src', './index.html?cb=' + Date.now() + (location.hash || ''));
  function jump(){
    var id = (location.search.match(/[?&]to=([^&]+)/) || [])[1];
    if(!id) return;
    try{
      var d = f.contentDocument;
      var el = d.getElementById(decodeURIComponent(id));
      if(el) el.scrollIntoView({block:'start'});
      else f.contentWindow.scrollTo(0, 0);
    }catch(e){}
  }
  f.addEventListener('load', function(){ setTimeout(jump, 400); });
</script>
</body>
</html>
