<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>선희한국어 2A 문법공부</title>
<style>
  :root{
    --bg:#f6f8fb; --card:#ffffff; --ink:#0f172a; --sub:#475569; --muted:#94a3b8;
    --line:#e2e8f0; --blue:#2563eb; --blue-l:#eff6ff; --green:#15803d; --green-l:#f0fdf4;
    --red:#dc2626; --red-l:#fef2f2; --amber:#b45309; --amber-l:#fffbeb;
    --r:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    line-height:1.6; font-size:17px; letter-spacing:-0.2px;
    -webkit-text-size-adjust:100%;
    word-break:keep-all; overflow-wrap:break-word;
  }
  #app{max-width:430px;margin:0 auto;padding:14px 14px 96px;min-height:100vh}
  .hidden{display:none !important}

  /* ---------- 잠금 화면 ---------- */
  body.locked #app{display:none}
  body:not(.locked) #gate{display:none}
  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
  .pw-card{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:32px 24px;
    box-shadow:0 10px 30px rgba(15,23,42,.08);text-align:center;border:1px solid var(--line)}
  .pw-badge{display:inline-block;background:var(--blue-l);color:var(--blue);font-size:13px;font-weight:800;
    padding:6px 13px;border-radius:999px;margin-bottom:16px}
  .pw-title{font-size:22px;font-weight:800;margin-bottom:8px;line-height:1.35;letter-spacing:-0.6px}
  .pw-desc{font-size:14.5px;color:var(--sub);margin-bottom:22px;line-height:1.55}
  .pw-input{width:100%;padding:15px 16px;font-size:17px;border:1.5px solid #cbd5e1;border-radius:12px;
    outline:none;text-align:center;letter-spacing:3px;margin-bottom:12px}
  .pw-input:focus{border-color:var(--blue)}
  .pw-btn{width:100%;padding:15px;font-size:17px;font-weight:800;color:#fff;background:var(--blue);
    border:none;border-radius:12px;cursor:pointer}
  .pw-btn:active{background:#1d4ed8}
  .pw-err{color:var(--red);font-size:13.5px;margin-top:10px;min-height:20px}

  /* ---------- 공통 ---------- */
  .top{display:flex;align-items:flex-start;gap:10px;margin:4px 2px 16px}
  .top h1{font-size:21px;font-weight:800;letter-spacing:-0.7px;line-height:1.3}
  .top .sub{font-size:12.5px;color:var(--sub);margin-top:4px;font-weight:600}
  .back{border:none;background:#fff;border:1px solid var(--line);width:38px;height:38px;border-radius:11px;
    font-size:18px;color:var(--sub);cursor:pointer;flex:0 0 auto;line-height:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
    box-shadow:0 2px 8px rgba(15,23,42,.04)}
  .btn{width:100%;border:none;border-radius:13px;padding:15px 16px;font-size:16.5px;font-weight:800;
    cursor:pointer;font-family:inherit;letter-spacing:-0.3px}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:active{background:#1d4ed8}
  .btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .btn-ghost:active{background:#f1f5f9}
  .btn-amber{background:var(--amber-l);color:var(--amber);border:1.5px solid #fde68a}

  /* ---------- 홈 ---------- */
  .quick{display:grid;gap:10px;margin-bottom:18px}
  .quick .btn{display:flex;align-items:center;justify-content:space-between;text-align:left}
  .quick .btn .k{font-size:12.5px;font-weight:700;opacity:.85;display:block;margin-top:2px}
  .list-title{display:flex;justify-content:space-between;align-items:baseline;margin:0 3px 9px}
  .list-title b{font-size:14px;color:var(--sub);font-weight:800}
  .list-title span{font-size:12px;color:var(--muted);font-weight:700}
  .lesson-card{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);
    border-radius:14px;padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:.15s;
    box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .lesson-card:active{background:#f8fafc;transform:scale(.994)}
  .num{flex:0 0 auto;width:50px;height:50px;border-radius:13px;background:var(--blue-l);color:var(--blue);
    font-weight:900;font-size:16.5px;display:flex;align-items:center;justify-content:center;letter-spacing:-0.4px}
  .lc-body{flex:1;min-width:0}
  .lc-title{font-size:15.5px;font-weight:800;line-height:1.35;letter-spacing:-0.4px}
  .lc-gram{font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.45;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lc-right{flex:0 0 auto;text-align:right}
  .lc-count{font-size:11.5px;color:var(--muted);font-weight:800}
  .lc-best{font-size:11.5px;font-weight:900;color:var(--green);margin-top:3px}

  /* ---------- 과 화면 ---------- */
  .lesson-head{margin-bottom:14px}
  .lesson-head .num{display:inline-flex;margin-bottom:8px}
  .lesson-head h2{font-size:20px;font-weight:800;line-height:1.35;letter-spacing:-0.6px}
  .lesson-head p{font-size:13px;color:var(--sub);margin-top:5px;font-weight:600}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
    background:var(--amber-l);border:1.5px solid #fde68a;border-radius:13px;padding:14px 15px;
    font-family:inherit;font-size:15px;font-weight:800;color:var(--amber);cursor:pointer;margin:14px 0 0}
  .sum-wrap{margin-top:10px;display:grid;gap:10px}
  .sum-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 15px}
  .sum-card .g{font-size:15.5px;font-weight:900;color:var(--blue);letter-spacing:-0.3px}
  .sum-card .row{font-size:13.5px;color:var(--sub);margin-top:7px;line-height:1.55}
  .sum-card .row b{color:var(--ink);font-weight:800;margin-right:4px}
  .sum-card .ex{font-size:13.5px;color:var(--ink);margin-top:8px;padding:9px 11px;background:#f8fafc;
    border-radius:9px;line-height:1.5;font-weight:600}

  /* ---------- 퀴즈 ---------- */
  .qtop{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:800;
    color:var(--sub);margin-bottom:8px}
  .bar{height:7px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-bottom:16px}
  .bar > i{display:block;height:100%;background:var(--blue);width:0;transition:width .25s ease}
  .tag{display:inline-block;background:var(--blue-l);color:var(--blue);font-size:12px;font-weight:800;
    padding:4px 10px;border-radius:999px;margin-bottom:12px}
  .qtext{font-size:19px;font-weight:800;line-height:1.55;letter-spacing:-0.5px;margin-bottom:8px;
    word-break:keep-all}
  .qtext .blank{color:var(--blue);letter-spacing:0;border-bottom:2.5px solid var(--blue);padding:0 10px}
  .qsub{font-size:13px;color:var(--sub);margin-bottom:16px;line-height:1.5;font-weight:600}
  .opts{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#fff;
    border:1.5px solid var(--line);border-radius:13px;padding:15px 15px;font-family:inherit;
    font-size:16.5px;font-weight:700;color:var(--ink);cursor:pointer;min-height:56px;letter-spacing:-0.3px}
  .opt .n{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:#f1f5f9;color:var(--sub);
    font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center}
  .opt:active{background:#f8fafc}
  .opt.correct{border-color:var(--green);background:var(--green-l);color:var(--green)}
  .opt.correct .n{background:var(--green);color:#fff}
  .opt.wrong{border-color:var(--red);background:var(--red-l);color:var(--red)}
  .opt.wrong .n{background:var(--red);color:#fff}
  .opt.dim{opacity:.55}
  .exp{margin-top:16px;border-radius:13px;padding:14px 15px;font-size:14px;line-height:1.6}
  .exp.ok{background:var(--green-l);border:1px solid #bbf7d0}
  .exp.no{background:var(--red-l);border:1px solid #fecaca}
  .exp .t{font-weight:900;font-size:14.5px;margin-bottom:6px;display:block}
  .exp.ok .t{color:var(--green)} .exp.no .t{color:var(--red)}
  .exp .h{color:var(--ink);font-weight:600;line-height:1.6}
  .exp .ans{margin-top:8px;font-weight:800;color:var(--ink);font-size:14.5px}
  .next{margin-top:14px}

  /* ---------- 결과 ---------- */
  .score{text-align:center;padding:26px 16px 20px}
  .score .circle{width:132px;height:132px;border-radius:50%;margin:0 auto 16px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;background:var(--blue-l);
    border:3px solid #bfdbfe}
  .score .circle b{font-size:38px;font-weight:900;color:var(--blue);line-height:1}
  .score .circle span{font-size:12.5px;font-weight:800;color:var(--blue);margin-top:4px}
  .score h2{font-size:20px;font-weight:900;letter-spacing:-0.5px}
  .score p{font-size:14px;color:var(--sub);margin-top:6px;font-weight:600}
  .result-btns{display:grid;gap:9px;margin-top:18px}
  .review-h{margin:22px 2px 8px;font-size:14px;font-weight:900;color:var(--sub)}
  .rev{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:9px}
  .rev .rq{font-size:14.5px;font-weight:800;line-height:1.5;letter-spacing:-0.3px}
  .rev .rq .blank{color:var(--blue);border-bottom:2px solid #bfdbfe;padding:0 6px}
  .rev .ra{font-size:13.5px;color:var(--green);font-weight:800;margin-top:7px}
  .rev .rh{font-size:13px;color:var(--sub);margin-top:5px;line-height:1.5;font-weight:600}
  .rev .rg{font-size:11.5px;color:var(--muted);font-weight:800;margin-bottom:5px}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:36px 10px;font-weight:700;line-height:1.7}

  /* ---------- 오답 노트 ---------- */
  .wrong-item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:10px}
  .wrong-item .wl{font-size:11.5px;font-weight:900;color:var(--blue);margin-bottom:6px}
  .wrong-item .wq{font-size:15px;font-weight:800;line-height:1.5;letter-spacing:-0.3px}
  .wrong-item .wq .blank{color:var(--blue);border-bottom:2px solid #bfdbfe;padding:0 6px}
  .wrong-item .wa{font-size:14px;color:var(--green);font-weight:800;margin-top:8px}
  .wrong-item .wh{font-size:13px;color:var(--sub);margin-top:5px;line-height:1.5;font-weight:600}
</style>
</head>
<body>
<!-- 비밀번호 없이 바로 열리는 배포본 (2a-grammar-open) -->

<div id="app">
  <!-- 홈 -->
  <section id="scr-home">
    <div class="top">
      <div>
        <h1>선희한국어 2A 문법공부</h1>
        <div class="sub">서울대 한국어+ 2A · 18과 문법 퀴즈 · 전 137문항</div>
      </div>
    </div>
    <div class="quick">
      <button class="btn btn-primary" onclick="startRandom()">
        <span>전 과 랜덤 종합 퀴즈<span class="k">1-1과 ~ 9-2과에서 20문항</span></span><span>→</span>
      </button>
      <button class="btn btn-amber" id="wrongBtn" onclick="showWrong()">
        <span>오답 노트<span class="k" id="wrongSub">틀린 문제 다시 풀기</span></span><span>→</span>
      </button>
    </div>
    <div class="list-title"><b>과 선택 (1-1 ~ 9-2)</b><span>18개 과</span></div>
    <div id="lessonList"></div>
  </section>

  <!-- 과 화면 -->
  <section id="scr-lesson" class="hidden">
    <div class="top"><button class="back" onclick="goHome()">←</button><div><h1 id="lesNum">1-1과</h1></div></div>
    <div class="card lesson-head">
      <h2 id="lesTitle"></h2>
      <p id="lesGram"></p>
    </div>
    <button class="toggle" id="sumToggle" onclick="toggleSummary()">
      <span>핵심 문법 요약 카드</span><span id="sumArrow">펼치기 ▾</span>
    </button>
    <div class="sum-wrap hidden" id="sumWrap"></div>
    <div style="height:14px"></div>
    <button class="btn btn-primary" onclick="startLesson()">이 과 퀴즈 시작</button>
    <div class="lc-count" id="lesCount" style="text-align:center;margin-top:10px"></div>
  </section>

  <!-- 퀴즈 -->
  <section id="scr-quiz" class="hidden">
    <div class="top"><button class="back" onclick="quitQuiz()">←</button>
      <div><h1 id="quizHead">1-1과</h1></div></div>
    <div class="qtop"><span id="qCount">문제 1 / 8</span><span id="qScore">맞힌 문제 0</span></div>
    <div class="bar"><i id="qBar"></i></div>
    <div class="tag" id="qTag"></div>
    <div class="qtext" id="qText"></div>
    <div class="qsub" id="qSub"></div>
    <div class="opts" id="qOpts"></div>
    <div id="expBox"></div>
    <button class="btn btn-primary next hidden" id="nextBtn" onclick="nextQ()">다음 문제 →</button>
  </section>

  <!-- 결과 -->
  <section id="scr-result" class="hidden">
    <div class="top"><button class="back" onclick="goHome()">←</button><div><h1 id="resHead">결과</h1></div></div>
    <div class="card">
      <div class="score">
        <div class="circle"><b id="resScore">100</b><span>점</span></div>
        <h2 id="resMsg">완벽해요!</h2>
        <p id="resSub"></p>
      </div>
      <div class="result-btns">
        <button class="btn btn-primary" id="retryWrong" onclick="retryWrong()">틀린 문제만 다시 풀기</button>
        <button class="btn btn-ghost" onclick="retryAll()">이 퀴즈 다시 풀기</button>
        <button class="btn btn-ghost" onclick="goHome()">과 목록으로</button>
      </div>
    </div>
    <div class="review-h" id="reviewHead">문제별 해설</div>
    <div id="reviewList"></div>
  </section>

  <!-- 오답 노트 -->
  <section id="scr-wrong" class="hidden">
    <div class="top"><button class="back" onclick="goHome()">←</button><div><h1>오답 노트</h1></div></div>
    <button class="btn btn-primary" onclick="retryWrongNotes()">오답만 다시 풀기</button>
    <div style="height:9px"></div>
    <button class="btn btn-ghost" onclick="clearWrong()">오답 노트 비우기</button>
    <div class="review-h" id="wrongHead"></div>
    <div id="wrongList"></div>
  </section>
</div>

<script>
const DATA = [{"id":"1-1","unit":1,"name":"1-1과","title":"한국어를 배우려고 한국에 왔어요","summary":[{"g":"명(이)라고 하다","use":"격식적인 상황에서 자기나 사물의 이름을 소개할 때","form":"받침 있으면 '명 + 이라고 하다' / 받침 없으면 '명 + 라고 하다'","ex":"저는 소날이라고 합니다. / 이것은 김치라고 합니다."},{"g":"동-(으)려고","use":"뒤에 오는 행동의 목적·의도를 나타냄 (주어가 같아요)","form":"'ㄹ' 받침이거나 받침 없으면 '-려고' / 그 밖의 받침은 '-으려고'","ex":"점심을 먹으려고 학생 식당에 갔어요."}],"quiz":[{"g":"명(이)라고 하다","q":"저는 ____ 합니다.","sub":"넣을 이름: 소날","options":["소날이라고","소날라고","소날이니까","소날인데"],"ans":0,"hint":"받침이 있는 명사 뒤에는 '-이라고 하다'를 붙여요. (소날 → 소날이라고 합니다)","src":"저는 소날이라고 합니다."},{"g":"명(이)라고 하다","q":"나: 만나서 반갑습니다. 저는 ____ 합니다.","sub":"넣을 이름: 영호","options":["영호라고","영호이라고","영호라서","영호인데"],"ans":0,"hint":"받침이 없는 명사 뒤에는 '-라고 하다'를 붙여요. (영호 → 영호라고 합니다)","src":"나: 만나서 반갑습니다. 저는 영호라고 합니다."},{"g":"명(이)라고 하다","q":"이것은 ____ 합니다. 한국의 전통 음식입니다.","sub":"넣을 이름: 김치","options":["김치라고","김치이라고","김치인데","김치니까"],"ans":0,"hint":"이름뿐 아니라 물건·음식의 이름을 말할 때도 써요. (김치 → 김치라고 합니다)","src":"이것은 김치라고 합니다. 한국의 전통 음식입니다."},{"g":"명(이)라고 하다","q":"'안녕하세요'를 영어로 ____?","sub":"무엇인지 물을 때 쓰는 말을 고르세요.","options":["뭐라고 해요","뭐이라고 해요","무엇라고 해요","뭘라고 해요"],"ans":0,"hint":"'무엇'의 줄임말 '뭐'에는 받침이 없어서 '뭐라고'를 붙여요. (뭐 → 뭐라고 해요?)","src":"'안녕하세요'를 영어로 뭐라고 해요?"},{"g":"동-(으)려고","q":"점심을 ____ 학생 식당에 갔어요.","sub":"'-(으)려고'(목적) 형태로 바꿔 씁니다. 기본형: 먹다","options":["먹으려고","먹려고","먹을려고","먹어서"],"ans":0,"hint":"받침이 있으면 '-으려고'를 붙여요. (먹다 → 먹으려고)","src":"점심을 먹으려고 학생 식당에 갔어요."},{"g":"동-(으)려고","q":"여권을 ____ 사진을 찍었어요.","sub":"'-(으)려고'(목적) 형태로 바꿔 씁니다. 기본형: 만들다 ('ㄹ' 받침)","options":["만들려고","만들으려고","만드려고","만들어서"],"ans":0,"hint":"'ㄹ' 받침은 받침이 없는 것과 같아요. (만들다 → 만들려고)","src":"여권을 만들려고 사진을 찍었어요."},{"g":"동-(으)려고","q":"나: 김 선생님을 ____ 왔어요.","sub":"'-(으)려고'(목적) 형태로 바꿔 씁니다. 기본형: 만나다","options":["만나려고","만나으려고","만날려고","만나서"],"ans":0,"hint":"받침이 없으면 '-려고'를 붙여요. (만나다 → 만나려고)","src":"나: 김 선생님을 만나려고 왔어요."},{"g":"동-(으)려고","q":"밥을 ____ 식당에 갑시다.","sub":"'-(으)려고'는 청유문 '-(으)ㅂ시다'와 함께 쓸 수 없습니다.","options":["먹으러","먹으려고","먹을려고","먹으러고"],"ans":0,"hint":"뒤에 '갑시다·가세요'가 오면 '-으려고'는 쓸 수 없어요. (밥을 먹으러 식당에 갑시다.)","sr /* ---------- 저장소 ---------- */
const K_WRONG  = "snu2a_grammar_wrong_v1";
const K_BEST   = "snu2a_grammar_best_v1";

function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ---------- 과 목록 ---------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function withBlank(s){ return esc(s).replace(/____/g, '<span class="blank">＿＿＿</span>'); }

function renderHome(){
  const best = lsGet(K_BEST, {});
  const box = document.getElementById("lessonList");
  box.innerHTML = DATA.map(function(L){
    const b = best[L.id];
    return '<div class="lesson-card" onclick="openLesson(\'' + L.id + '\')">' +
      '<div class="num">' + L.name.replace("과","") + '</div>' +
      '<div class="lc-body"><div class="lc-title">' + esc(L.title) + '</div>' +
      '<div class="lc-gram">' + L.summary.map(function(s){ return esc(s.g); }).join(" · ") + '</div></div>' +
      '<div class="lc-right"><div class="lc-count">' + L.quiz.length + '문항</div>' +
      (b !== undefined ? '<div class="lc-best">' + b + '점</div>' : '') + '</div></div>';
  }).join("");
  const n = wrongList().length;
  document.getElementById("wrongSub").textContent = n ? (n + "문항 저장됨 · 다시 풀기") : "아직 틀린 문제가 없어요";
}

function goHome(){
  show("scr-home");
  renderHome();
  window.scrollTo(0,0);
}

/* ---------- 화면 전환 ---------- */
function show(id){
  ["scr-home","scr-lesson","scr-quiz","scr-result","scr-wrong"].forEach(function(s){
    document.getElementById(s).classList.toggle("hidden", s !== id);
  });
  window.scrollTo(0,0);
}

/* ---------- 과 화면 ---------- */
let curLesson = null, sumOpen = false;
function openLesson(id){
  curLesson = DATA.filter(function(L){ return L.id === id; })[0];
  document.getElementById("lesNum").textContent = curLesson.name;
  document.getElementById("lesTitle").textContent = curLesson.title;
  document.getElementById("lesGram").textContent = "목표 문법 · " + curLesson.summary.map(function(s){ return s.g; }).join(" / ");
  document.getElementById("sumWrap").innerHTML = curLesson.summary.map(function(s){
    return '<div class="sum-card"><div class="g">' + esc(s.g) + '</div>' +
      '<div class="row"><b>쓰임</b>' + esc(s.use) + '</div>' +
      '<div class="row"><b>형태</b>' + esc(s.form) + '</div>' +
      '<div class="ex">' + esc(s.ex) + '</div></div>';
  }).join("");
  document.getElementById("lesCount").textContent = curLesson.quiz.length + "문항 · 4지선다";
  sumOpen = false; setSummary(false);
  show("scr-lesson");
}
function setSummary(open){
  document.getElementById("sumWrap").classList.toggle("hidden", !open);
  document.getElementById("sumArrow").textContent = open ? "접기 ▴" : "펼치기 ▾";
}
function toggleSummary(){ sumOpen = !sumOpen; setSummary(sumOpen); }

/* ---------- 퀴즈 ---------- */
let quiz = null;

function makeItems(lesson){
  return lesson.quiz.map(function(q, i){
    const opts = shuffle(q.options.slice());
    return { lid: lesson.id, lname: lesson.name, idx: i, g: q.g, q: q.q, sub: q.sub,
             options: opts, ans: opts.indexOf(q.options[q.ans]), hint: q.hint };
  });
}
function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function startLesson(){
  const items = makeItems(curLesson);
  beginQuiz(items, curLesson.name, "lesson");
}
function startRandom(){
  const pool = [];
  DATA.forEach(function(L){ makeItems(L).forEach(function(it){ pool.push(it); }); });
  const items = shuffle(pool.slice()).slice(0, 20);
  beginQuiz(items, "전 과 랜덤 20문항", "random");
}
function beginQuiz(items, head, mode){
  answered = false;
  quiz = { items: items, i: 0, correct: 0, answers: [], head: head, mode: mode };
  document.getElementById("quizHead").textContent = head;
  show("scr-quiz");
  renderQ();
}
function quitQuiz(){
  if(confirm("퀴즈를 그만두고 나갈까요? 지금까지의 풀이는 저장되지 않아요.")){ goHome(); }
}

function renderQ(){
  const it = quiz.items[quiz.i];
  document.getElementById("qCount").textContent = "문제 " + (quiz.i + 1) + " / " + quiz.items.length;
  document.getElementById("qScore").textContent = "맞힌 문제 " + quiz.correct;
  document.getElementById("qBar").style.width = ((quiz.i) / quiz.items.length * 100) + "%";
  document.getElementById("qTag").textContent = it.g;
  document.getElementById("qText").innerHTML = withBlank(it.q);
  document.getElementById("qSub").textContent = it.sub || "";
  document.getElementById("expBox").innerHTML = "";
  document.getElementById("nextBtn").classList.add("hidden");
  document.getElementById("nextBtn").textContent = (quiz.i === quiz.items.length - 1) ? "결과 보기 →" : "다음 문제 →";

  const opts = document.getElementById("qOpts");
  opts.innerHTML = "";
  it.options.forEach(function(o, i){
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = '<span class="n">' + (i + 1) + '</span><span>' + esc(o) + '</span>';
    b.addEventListener("click", function(){ answer(i, b); });
    opts.appendChild(b);
  });
}

let answered = false;
function answer(pick, btn){
  if(answered) return;
  answered = true;
  const it = quiz.items[quiz.i];
  const ok = (pick === it.ans);
  const nodes = document.getElementById("qOpts").children;
  for(let i = 0; i < nodes.length; i++){
    nodes[i].classList.add("dim");
    nodes[i].style.pointerEvents = "none";
    if(i === it.ans){ nodes[i].classList.remove("dim"); nodes[i].classList.add("correct"); }
    if(i === pick && !ok){ nodes[i].classList.remove("dim"); nodes[i].classList.add("wrong"); }
  }
  if(ok) quiz.correct++;
  else addWrong(it.lid, it.idx);

  quiz.answers.push({ it: it, pick: pick, ok: ok });

  const box = document.getElementById("expBox");
  box.innerHTML = '<div class="exp ' + (ok ? 'ok' : 'no') + '">' +
    '<span class="t">' + (ok ? "정답이에요!" : "아쉬워요, 다시 확인해 봐요") + '</span>' +
    '<div class="h">' + esc(it.hint) + '</div>' +
    '<div class="ans">정답: ' + esc(it.options[it.ans]) + '</div></div>';
  document.getElementById("nextBtn").classList.remove("hidden");
  document.getElementById("qScore").textContent = "맞힌 문제 " + quiz.correct;
}

function nextQ(){
  answered = false;
  quiz.i++;
  if(quiz.i >= quiz.items.length) finish();
  else renderQ();
}

function finish(){
  const total = quiz.items.length, score = Math.round(quiz.correct / total * 100);
  document.getElementById("resHead").textContent = quiz.head + " 결과";
  document.getElementById("resScore").textContent = score;
  document.getElementById("resSub").textContent = total + "문항 중 " + quiz.correct + "문항을 맞혔어요.";
  let msg = "완벽해요!";
  if(score < 60) msg = "한 번 더 복습해 볼까요?";
  else if(score < 80) msg = "좋아요, 조금만 더!";
  else if(score < 100) msg = "아주 잘했어요!";
  document.getElementById("resMsg").textContent = msg;

  if(quiz.mode === "lesson" && curLesson){
    const best = lsGet(K_BEST, {});
    if(best[curLesson.id] === undefined || score > best[curLesson.id]){
      best[curLesson.id] = score; lsSet(K_BEST, best);
    }
  }
  // 이번에 맞힌 문제는 오답 노트에서 지우고, 틀린 문제는 남겨요.
  quiz.answers.forEach(function(a){ if(a.ok) removeWrong(a.it.lid, a.it.idx); });

  const wrongN = quiz.answers.filter(function(a){ return !a.ok; }).length;
  document.getElementById("retryWrong").classList.toggle("hidden", wrongN === 0);
  document.getElementById("retryWrong").textContent = "틀린 문제만 다시 풀기 (" + wrongN + "문항)";

  document.getElementById("reviewList").innerHTML = quiz.answers.map(function(a){
    return '<div class="rev"><div class="rg">' + esc(a.it.lname) + " · " + esc(a.it.g) + '</div>' +
      '<div class="rq">' + withBlank(a.it.q) + '</div>' +
      '<div class="ra">' + (a.ok ? "○ 맞혔어요 · " : "✕ 정답 · ") + esc(a.it.options[a.it.ans]) + '</div>' +
      '<div class="rh">' + esc(a.it.hint) + '</div></div>';
  }).join("");
  show("scr-result");
}
function retryAll(){ beginQuiz(quiz.items.map(function(x){ return x; }), quiz.head, quiz.mode); }
function retryWrong(){
  const items = quiz.answers.filter(function(a){ return !a.ok; }).map(function(a){ return a.it; });
  if(!items.length) return;
  beginQuiz(items, quiz.head + " · 틀린 문제", quiz.mode);
}

/* ---------- 오답 노트 ---------- */
function wrongList(){ return lsGet(K_WRONG, []); }
function addWrong(lid, idx){
  const list = wrongList();
  const key = lid + "#" + idx;
  if(!list.some(function(w){ return w.lid + "#" + w.idx === key; })){ list.push({ lid: lid, idx: idx }); lsSet(K_WRONG, list); }
}
function clearWrongOf(lid){
  lsSet(K_WRONG, wrongList().filter(function(w){ return w.lid !== lid; }));
}
function removeWrong(lid, idx){
  lsSet(K_WRONG, wrongList().filter(function(w){ return !(w.lid === lid && w.idx === idx); }));
}
function findItem(lid, idx){
  const L = DATA.filter(function(x){ return x.id === lid; })[0];
  if(!L || !L.quiz[idx]) return null;
  return makeItems(L)[idx];
}
function showWrong(){
  const list = wrongList().map(function(w){ return findItem(w.lid, w.idx); }).filter(Boolean);
  const head = document.getElementById("wrongHead");
  const box = document.getElementById("wrongList");
  if(!list.length){
    head.textContent = "";
    box.innerHTML = '<div class="empty">아직 틀린 문제가 없어요.<br>퀴즈를 풀면 틀린 문제가 여기에 모여요.</div>';
  } else {
    head.textContent = "틀린 문제 " + list.length + "문항";
    box.innerHTML = list.map(function(it){
      return '<div class="wrong-item"><div class="wl">' + esc(it.lname) + " · " + esc(it.g) + '</div>' +
        '<div class="wq">' + withBlank(it.q) + '</div>' +
        '<div class="wa">정답: ' + esc(it.options[it.ans]) + '</div>' +
        '<div class="wh">' + esc(it.hint) + '</div></div>';
    }).join("");
  }
  show("scr-wrong");
}
function retryWrongNotes(){
  const list = wrongList().map(function(w){ return findItem(w.lid, w.idx); }).filter(Boolean);
  if(!list.length){ alert("아직 틀린 문제가 없어요."); return; }
  beginQuiz(shuffle(list.slice()), "오답 노트 · " + list.length + "문항", "wrong");
}
function clearWrong(){
  if(!wrongList().length){ alert("오답 노트가 이미 비어 있어요."); return; }
  if(confirm("오답 노트를 모두 비울까요?")){ lsSet(K_WRONG, []); showWrong(); }
}

/* ---------- 시작 ---------- */
renderHome();
</script>
